<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — ZufiTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-accent-lt) 100%);
    }
    .auth-container {
      background: var(--color-surface);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.08);
      width: 100%; max-width: 440px;
      padding: 40px 36px;
    }
    .auth-logo {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 800;
      text-align: center; margin-bottom: 8px;
      color: var(--color-dark);
    }
    .auth-logo span { color: var(--color-accent); }
    .auth-subtitle {
      text-align: center; color: var(--color-muted);
      font-size: 14px; margin-bottom: 32px;
    }
    .auth-link {
      text-align: center; font-size: 13px; color: var(--color-muted);
      margin-top: 20px;
    }
    .auth-link a { color: var(--color-accent); font-weight: 600; }
    .back-link {
      position: absolute; top: 20px; left: 20px;
      color: var(--color-muted); font-size: 13px;
      text-decoration: none; display: flex; align-items: center; gap: 6px;
    }
    .back-link:hover { color: var(--color-accent); }
    .demo-note {
      background: var(--color-accent-lt); color: var(--color-accent);
      font-size: 12px; text-align: center; padding: 10px 12px;
      border-radius: 8px; margin-bottom: 24px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Back to Home</a>

  <div class="auth-container">
    <div class="auth-logo">Zufi<span>Tech</span></div>
    <p class="auth-subtitle">Admin Dashboard Access</p>

    <div class="demo-note">
      🔓 Demo mode — this is a static site, so just click <strong>Enter Dashboard</strong>.
    </div>

    <form onsubmit="enterDashboard(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="input" id="loginEmail" placeholder="admin@zufitech.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="input" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Enter Dashboard</button>
      <p class="auth-link"><a href="index.html">← Back to store</a></p>
    </form>
  </div>

  <script>
    function enterDashboard(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
